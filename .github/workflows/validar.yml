name: Validar migraciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hatocontrol
          POSTGRES_USER: hatocontrol
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hatocontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones (como en producción)
        run: >
          docker run --rm --network host -v "$PWD:/proyecto"
          flyway/flyway:11
          -url=jdbc:postgresql://localhost:5432/hatocontrol
          -user=hatocontrol -password=prueba-ci
          -locations=filesystem:/proyecto/migraciones
          migrate
      - name: Cargar datos de prueba
        run: >
          docker run --rm --network host -v "$PWD:/proyecto"
          flyway/flyway:11
          -url=jdbc:postgresql://localhost:5432/hatocontrol
          -user=hatocontrol -password=prueba-ci
          -locations=filesystem:/proyecto/migraciones,filesystem:/proyecto/datos-prueba
          migrate info
