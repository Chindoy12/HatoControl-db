name: Validar migraciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hatocontrol
          POSTGRES_USER: hatocontrol
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hatocontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones con Flyway
        run: >
          docker run --rm --network host -v "$PWD/migraciones:/flyway/sql"
          flyway/flyway:11
          -url=jdbc:postgresql://localhost:5432/hatocontrol
          -user=hatocontrol -password=prueba-ci
          -locations=filesystem:/flyway/sql
          migrate
